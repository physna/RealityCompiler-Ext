name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch tags with annotations
        run: git fetch --tags --force

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release title from tag annotation
        id: title
        run: |
          # Get the tag annotation message (e.g., "v0.2.0 - Pipeline Refactor")
          annotation=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          if [ -z "$annotation" ] || [ "$annotation" = "$GITHUB_REF_NAME" ]; then
            annotation="$GITHUB_REF_NAME"
          fi
          echo "name=$annotation" >> "$GITHUB_OUTPUT"

      - name: Verify extension.toml version matches tag
        run: |
          toml_version=$(grep -oP 'version\s*=\s*"\K[^"]+' config/extension.toml)
          if [ "$toml_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match extension.toml version ($toml_version)"
            exit 1
          fi

      - name: Build release zip
        run: python scripts/publish/make_release.py

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for the current version
          version="${{ steps.version.outputs.version }}"
          # Get everything between this version header and the next version header (or EOF)
          changelog=$(awk "/^## \[${version}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" docs/CHANGELOG.md)
          # Write to file to preserve formatting
          echo "$changelog" > /tmp/changelog_body.md

      - name: Determine previous tag
        id: prev_tag
        run: |
          # Get the tag before the current one
          prev=$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')
          echo "tag=${prev:-}" >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: body
        run: |
          version="${{ steps.version.outputs.version }}"
          prev_tag="${{ steps.prev_tag.outputs.tag }}"
          {
            echo "## What's Changed"
            echo ""
            cat /tmp/changelog_body.md
            echo ""
            if [ -n "$prev_tag" ]; then
              echo "**Full Changelog**: [\`${prev_tag}...v${version}\`](https://github.com/${{ github.repository }}/compare/${prev_tag}...v${version})"
            fi
          } > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ steps.title.outputs.name }}"
          body_path: /tmp/release_body.md
          files: physna.reality_compiler-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: false
